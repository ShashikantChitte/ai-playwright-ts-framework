name: playwright

on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: '0 1 * * *' }]        # nightly full run
  workflow_dispatch:
    inputs:
      scope:
        description: smoke (chromium, verified tests) or full (all browsers + API, 4 shards)
        type: choice
        default: smoke
        options: [smoke, full]

env:
  CI: 'true'
  # Optional repo secrets. If unset, the framework falls back to the public demo credentials.
  SHOP_USER_EMAIL: ${{ secrets.SHOP_USER_EMAIL }}
  SHOP_USER_PASSWORD: ${{ secrets.SHOP_USER_PASSWORD }}
  API_USER_EMAIL: ${{ secrets.API_USER_EMAIL }}
  API_USER_PASSWORD: ${{ secrets.API_USER_PASSWORD }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run test:unit

  # Fast gate on every push/PR: verified @smoke tests on Chromium.
  smoke:
    needs: quality
    if: github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'smoke')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test:smoke -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: smoke-results
          path: test-results
          retention-days: 7

  # Nightly / on demand: everything, sharded.
  full:
    needs: quality
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix: { shard: [1, 2, 3, 4] }
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run test -- --shard=${{ matrix.shard }}/4
        env:
          HOME: /root   # Firefox refuses to launch if $HOME isn't owned by the current user
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: full-results-${{ matrix.shard }}
          path: |
            blob-report
            test-results
          retention-days: 7
